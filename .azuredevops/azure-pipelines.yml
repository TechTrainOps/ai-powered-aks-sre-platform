trigger: none

pool:
  name: "MultiOSPool"

variables:
  terraformVersion: "1.11.2"
  azureServiceConnection: "sc-azure-ai-aks-sre"

steps:

- checkout: self
  displayName: "Checkout source"

- task: TerraformInstaller@1
  displayName: "Install Terraform"
  inputs:
    terraformVersion: "$(terraformVersion)"

- task: AzureCLI@2
  displayName: "Terraform Init"
  inputs:
    azureSubscription: "$(azureServiceConnection)"
    addSpnToEnvironment: true
    scriptType: "ps"
    scriptLocation: "inlineScript"
    workingDirectory: "$(Build.SourcesDirectory)/infra"
    inlineScript: |
      $ErrorActionPreference = "Stop"

      Write-Host "========================================="
      Write-Host "Azure Authentication"
      Write-Host "========================================="

      az account show `
        --query "{name:name,id:id,tenantId:tenantId,userType:user.type}" `
        -o table

      Write-Host ""
      Write-Host "========================================="
      Write-Host "Terraform Version"
      Write-Host "========================================="

      terraform version

      Write-Host ""
      Write-Host "========================================="
      Write-Host "OIDC Configuration"
      Write-Host "========================================="

      Write-Host "Service connection ID:"
      Write-Host $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

      Write-Host "Service principal ID:"
      Write-Host $env:servicePrincipalId

      Write-Host "Tenant ID:"
      Write-Host $env:tenantId

      Write-Host ""
      Write-Host "========================================="
      Write-Host "Configure Terraform Azure OIDC"
      Write-Host "========================================="

      $env:ARM_USE_OIDC = "true"
      $env:ARM_USE_AZUREAD = "true"

      $env:ARM_CLIENT_ID = $env:servicePrincipalId
      $env:ARM_TENANT_ID = $env:tenantId
      $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

      Write-Host ""
      Write-Host "Running Terraform init..."

      terraform init -input=false

- task: PowerShell@2
  displayName: "Terraform Format Check"
  inputs:
    targetType: "inline"
    workingDirectory: "$(Build.SourcesDirectory)/infra"
    script: |
      $ErrorActionPreference = "Stop"
      terraform fmt -check -recursive

- task: PowerShell@2
  displayName: "Terraform Validate"
  inputs:
    targetType: "inline"
    workingDirectory: "$(Build.SourcesDirectory)/infra"
    script: |
      $ErrorActionPreference = "Stop"
      terraform validate      

- task: AzureCLI@2
  displayName: "Terraform Plan"
  inputs:
    azureSubscription: "$(azureServiceConnection)"
    addSpnToEnvironment: true
    scriptType: "ps"
    scriptLocation: "inlineScript"
    workingDirectory: "$(Build.SourcesDirectory)/infra"
    inlineScript: |
      $ErrorActionPreference = "Stop"

      $env:ARM_USE_OIDC = "true"
      $env:ARM_USE_AZUREAD = "true"

      terraform plan `
        -input=false `
        -out="$(Build.ArtifactStagingDirectory)/tfplan"      