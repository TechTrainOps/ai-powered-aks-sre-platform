trigger: none

pool:
  name: "MultiOSPool"

variables:
  terraformVersion: "1.11.2"
  azureServiceConnection: "sc-azure-ai-aks-sre"

stages:

- stage: TerraformPlan
  displayName: "Terraform Plan"

  jobs:

  - job: Plan
    displayName: "Terraform Plan"

    steps:

    - checkout: self
      displayName: "Checkout source"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "$(terraformVersion)"

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: "$(Build.SourcesDirectory)/infra"
        inlineScript: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================="
          Write-Host "Azure Authentication"
          Write-Host "========================================="

          az account show `
            --query "{name:name,id:id,tenantId:tenantId,userType:user.type}" `
            -o table

          Write-Host ""
          Write-Host "Terraform version:"
          terraform version

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"
          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          Write-Host ""
          Write-Host "Running Terraform init..."

          terraform init -input=false

    - task: PowerShell@2
      displayName: "Terraform Format Check"
      inputs:
        targetType: "inline"
        workingDirectory: "$(Build.SourcesDirectory)/infra"
        script: |
          $ErrorActionPreference = "Stop"
          terraform fmt -check -recursive

    - task: PowerShell@2
      displayName: "Terraform Validate"
      inputs:
        targetType: "inline"
        workingDirectory: "$(Build.SourcesDirectory)/infra"
        script: |
          $ErrorActionPreference = "Stop"
          terraform validate

    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: "$(Build.SourcesDirectory)/infra"
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show --query "id" -o tsv

          Write-Host "Subscription: $subscriptionId"

          $env:TF_VAR_subscription_id = $subscriptionId
          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"
          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          Write-Host ""
          Write-Host "Running Terraform plan..."

          terraform plan `
            -input=false `
            -out="$(Build.ArtifactStagingDirectory)/tfplan"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Plan"
      inputs:
        targetPath: "$(Build.ArtifactStagingDirectory)/tfplan"
        artifact: "terraform-plan"
        publishLocation: "pipeline"

- stage: TerraformApply
  displayName: "Terraform Apply"
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:

  - job: Approval
    displayName: "Approve Infrastructure Deployment"
    pool: server

    steps:

    - task: ManualValidation@1
      displayName: "Approve Terraform Apply"
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          shakirshah@microsoft.com
        instructions: |
          Review the Terraform Plan from the previous stage.

          Planned changes:
          18 resources to be created
          0 resources changed
          0 resources destroyed

          Approve this validation to deploy the infrastructure to Azure.
        onTimeout: "reject"

  - job: Apply
    displayName: "Terraform Apply"
    dependsOn: Approval
    condition: succeeded()

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self
      displayName: "Checkout source"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "$(terraformVersion)"

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Plan"
      inputs:
        artifact: "terraform-plan"
        path: "$(Pipeline.Workspace)/terraform-plan"

    - task: AzureCLI@2
      displayName: "Terraform Init for Apply"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: "$(Build.SourcesDirectory)/infra"
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show --query "id" -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId
          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"
          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform init -input=false

    - task: AzureCLI@2
      displayName: "Terraform Apply"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: "$(Build.SourcesDirectory)/infra"
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show --query "id" -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId
          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"
          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          Write-Host "Applying reviewed Terraform plan..."

          terraform apply `
            -input=false `
            "$(Pipeline.Workspace)/terraform-plan/tfplan"