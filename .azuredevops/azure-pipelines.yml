trigger: none

variables:
  terraformVersion: "1.11.2"
  azureServiceConnection: "sc-azure-ai-aks-sre"
  imageName: "sre-api"
  namespace: "sre"

stages:

# ============================================================
# 1. TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: "Terraform Plan"

  jobs:

  - job: Plan
    displayName: "Terraform Plan"

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self
      displayName: "Checkout source"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "$(terraformVersion)"

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform init -input=false

    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Terraform Format Check"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        script: |
          $ErrorActionPreference = "Stop"

          terraform fmt -check -recursive

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Terraform Validate"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        script: |
          $ErrorActionPreference = "Stop"

          terraform validate

    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform plan `
            -input=false `
            -out="$(Build.ArtifactStagingDirectory)\tfplan"

    # --------------------------------------------------------
    # Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Plan"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\tfplan'
        artifact: "terraform-plan"
        publishLocation: "pipeline"


# ============================================================
# 2. TERRAFORM APPLY
# ============================================================

- stage: TerraformApply
  displayName: "Terraform Apply"

  dependsOn:
  - TerraformPlan

  condition: succeeded()

  jobs:

  # ----------------------------------------------------------
  # Manual approval
  # ----------------------------------------------------------

  - job: Approval
    displayName: "Infrastructure Approval"

    pool: server

    steps:
    - task: ManualValidation@1
      displayName: "Approve Terraform Apply"
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          YOUR_EMAIL
        instructions: |
          Review the Terraform plan.
          Approve to apply the reviewed infrastructure changes.
        onTimeout: "reject"

  # ----------------------------------------------------------
  # Terraform Apply
  # ----------------------------------------------------------

  - job: Apply
    displayName: "Terraform Apply"

    dependsOn:
    - Approval

    condition: succeeded()

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self
      displayName: "Checkout source"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "$(terraformVersion)"

    # --------------------------------------------------------
    # Download Terraform Plan
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Plan"
      inputs:
        artifact: "terraform-plan"
        path: '$(Pipeline.Workspace)\terraform-plan'

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform init -input=false

    # --------------------------------------------------------
    # Terraform Apply
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Terraform Apply"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform apply `
            -input=false `
            "$(Pipeline.Workspace)\terraform-plan\tfplan"

    # --------------------------------------------------------
    # Verify Terraform State After Apply
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Verify Terraform OpenAI State After Apply"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          Write-Host "================================================"
          Write-Host "Terraform State After Apply"
          Write-Host "================================================"

          terraform state list

          Write-Host ""
          Write-Host "================================================"
          Write-Host "Cognitive Deployment State"
          Write-Host "================================================"

          terraform state list |
            Select-String "cognitive_deployment"

          Write-Host ""
          Write-Host "================================================"
          Write-Host "OpenAI Deployment Output"
          Write-Host "================================================"

          terraform output openai_deployment_name

          Write-Host ""
          Write-Host "================================================"
          Write-Host "All Terraform Outputs"
          Write-Host "================================================"

          terraform output -json


    # --------------------------------------------------------
    # Export Terraform Outputs
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Export Terraform Outputs"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          Write-Host "================================================"
          Write-Host "Exporting Terraform Outputs"
          Write-Host "================================================"

          $outputFile = "$(Build.ArtifactStagingDirectory)\terraform-outputs.json"

          $terraformOutput = terraform output -json

          if ($LASTEXITCODE -ne 0) {
            throw "terraform output failed with exit code $LASTEXITCODE"
          }

          [System.IO.File]::WriteAllText(
            $outputFile,
            $terraformOutput,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host ""
          Write-Host "Terraform output file:"
          Write-Host $outputFile

          Write-Host ""
          Write-Host "================================================"
          Write-Host "OpenAI Deployment From Exported JSON"
          Write-Host "================================================"

          $parsed = $terraformOutput | ConvertFrom-Json

          if ($null -eq $parsed.openai_deployment_name) {
            throw "openai_deployment_name is missing from terraform output."
          }

          $deploymentName = $parsed.openai_deployment_name.value

          Write-Host "Deployment: [$deploymentName]"

          if ([string]::IsNullOrWhiteSpace($deploymentName)) {
            throw "openai_deployment_name exists but has an empty value."
          }

          Write-Host ""
          Write-Host "Terraform OpenAI deployment output verified successfully."

          $analyserClientId = terraform output -raw analyser_client_id

          if ($LASTEXITCODE -ne 0) {
          throw "Failed to read analyser_client_id from Terraform."
          }

          $analyserClientId = $analyserClientId.Trim()

          if ([string]::IsNullOrWhiteSpace($analyserClientId)) {
          throw "analyser_client_id Terraform output is empty."
          }

          $analyserClientIdFile = "$(Build.ArtifactStagingDirectory)\analyser-client-id.txt"
          Set-Content `
            -Path $analyserClientIdFile `
            -Value $analyserClientId `
            -NoNewline `
            -Encoding UTF8

          Write-Host "Analyser client ID artifact created."

    # --------------------------------------------------------
    # Publish Terraform Outputs
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Outputs"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\terraform-outputs.json'
        artifact: "terraform-outputs"
        publishLocation: "pipeline"
 
    - task: PublishPipelineArtifact@1
      displayName: "Publish Analyser Client ID"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\analyser-client-id.txt'
        artifact: "analyser-client-id"
        publishLocation: "pipeline"

# ============================================================
# 3. APPLICATION TESTS
# ============================================================

- stage: ApplicationTests
  displayName: "Application Tests"

  dependsOn:
  - TerraformApply

  condition: succeeded()

  jobs:

  # ----------------------------------------------------------
  # sre-api tests
  # ----------------------------------------------------------

  - job: SreApiTests
    displayName: "Run sre-api Tests"

    pool:
      vmImage: "ubuntu-latest"

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      displayName: "Use Python 3.12"
      inputs:
        versionSpec: "3.12"

    - bash: |
        set -euo pipefail

        cd "$(Build.SourcesDirectory)/app"

        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

        python -m pytest -v

      displayName: "Run sre-api pytest"

  # ----------------------------------------------------------
  # AI analyser tests
  # ----------------------------------------------------------

  - job: AiAnalyserTests
    displayName: "Run AI Analyser Tests"

    pool:
      vmImage: "ubuntu-latest"

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      displayName: "Use Python 3.12"
      inputs:
        versionSpec: "3.12"

    - bash: |
        set -euo pipefail

        cd "$(Build.SourcesDirectory)/ai-analyser"

        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

        python -m pytest -v

      displayName: "Run AI analyser pytest"


# ============================================================
# 4. DOCKER BUILD + TRIVY + ACR PUSH
# ============================================================

- stage: ContainerBuild
  displayName: "Build Scan Push"

  dependsOn:
  - TerraformApply
  - ApplicationTests

  condition: succeeded()

  jobs:

  - job: Build
    displayName: "Build sre-api, collector and analyser"

    pool:
      vmImage: "ubuntu-latest"

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Download Terraform Outputs
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Outputs"
      inputs:
        artifact: "terraform-outputs"
        path: "$(Pipeline.Workspace)/terraform-outputs"

    # --------------------------------------------------------
    # Read ACR details
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        OUTPUT_FILE="$(Pipeline.Workspace)/terraform-outputs/terraform-outputs.json"

        ACR_NAME=$(python -c "
        import json
        with open('$OUTPUT_FILE', encoding='utf-8-sig') as f:
            data = json.load(f)
        print(data['acr_name']['value'])
        ")

        ACR_LOGIN_SERVER=$(python -c "
        import json
        with open('$OUTPUT_FILE', encoding='utf-8-sig') as f:
            data = json.load(f)
        print(data['acr_login_server']['value'])
        ")

        echo "ACR: $ACR_NAME"
        echo "Login server: $ACR_LOGIN_SERVER"

        echo "##vso[task.setvariable variable=acrName]$ACR_NAME"
        echo "##vso[task.setvariable variable=acrLoginServer]$ACR_LOGIN_SERVER"

      displayName: "Read ACR details"

    # --------------------------------------------------------
    # Docker Build - sre-api
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        cd "$(Build.SourcesDirectory)/app"

        docker build \
          -t "$(acrLoginServer)/sre-api:$(Build.BuildId)" \
          -t "$(acrLoginServer)/sre-api:latest" \
          .

      displayName: "Build sre-api image"

    # --------------------------------------------------------
    # Docker Build - incident collector
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        cd "$(Build.SourcesDirectory)/incident-collector"

        docker build \
          -t "$(acrLoginServer)/incident-collector:$(Build.BuildId)" \
          -t "$(acrLoginServer)/incident-collector:latest" \
          .

      displayName: "Build incident collector image"

    # --------------------------------------------------------
    # Docker Build - AI analyser
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        cd "$(Build.SourcesDirectory)/ai-analyser"

        docker build \
          -t "$(acrLoginServer)/ai-analyser:$(Build.BuildId)" \
          -t "$(acrLoginServer)/ai-analyser:latest" \
          .

      displayName: "Build AI analyser image"

    # --------------------------------------------------------
    # Validate collector image security context
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        USER_ID=$(docker inspect "$(acrLoginServer)/incident-collector:$(Build.BuildId)" \
          --format '{{.Config.User}}')

        echo "Incident collector container USER: $USER_ID"

        if [[ "$USER_ID" != "10001:10001" ]]; then
          echo "ERROR: Incident collector image must run as UID/GID 10001."
          exit 1
        fi

        echo "Incident collector image user validation passed."

      displayName: "Validate incident collector security context"

    # --------------------------------------------------------
    # Validate AI analyser image security context
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        USER_ID=$(docker inspect "$(acrLoginServer)/ai-analyser:$(Build.BuildId)" \
          --format '{{.Config.User}}')

        echo "AI analyser container USER: $USER_ID"

        if [[ "$USER_ID" != "10001:10001" ]]; then
          echo "ERROR: AI analyser image must run as UID/GID 10001."
          exit 1
        fi

        echo "AI analyser image user validation passed."

      displayName: "Validate AI analyser security context"

    # --------------------------------------------------------
    # Trivy Installation
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install -y wget gnupg

        wget -qO- \
          https://aquasecurity.github.io/trivy-repo/deb/public.key |
          gpg --dearmor |
          sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo \
          "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
          https://aquasecurity.github.io/trivy-repo/deb \
          generic main" |
          sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy

      displayName: "Install Trivy"

    # --------------------------------------------------------
    # Trivy - sre-api
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          "$(acrLoginServer)/sre-api:$(Build.BuildId)"

      displayName: "Scan sre-api image"

    # --------------------------------------------------------
    # Trivy - incident collector
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          "$(acrLoginServer)/incident-collector:$(Build.BuildId)"

      displayName: "Scan incident collector image"

    # --------------------------------------------------------
    # Trivy - AI analyser
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          "$(acrLoginServer)/ai-analyser:$(Build.BuildId)"

      displayName: "Scan AI analyser image"

    # --------------------------------------------------------
    # Login to ACR
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Login to ACR"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          set -euo pipefail

          az acr login --name "$(acrName)"

    # --------------------------------------------------------
    # Push sre-api image
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        docker push \
          "$(acrLoginServer)/sre-api:$(Build.BuildId)"

        docker push \
          "$(acrLoginServer)/sre-api:latest"

      displayName: "Push sre-api image"

    # --------------------------------------------------------
    # Push incident collector image
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        docker push \
          "$(acrLoginServer)/incident-collector:$(Build.BuildId)"

        docker push \
          "$(acrLoginServer)/incident-collector:latest"

      displayName: "Push incident collector image"

    # --------------------------------------------------------
    # Push AI analyser image
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        docker push \
          "$(acrLoginServer)/ai-analyser:$(Build.BuildId)"

        docker push \
          "$(acrLoginServer)/ai-analyser:latest"

      displayName: "Push AI analyser image"


# ============================================================
# 5. HELM VALIDATION
# ============================================================

- stage: HelmValidation
  displayName: "Validate Helm Chart"

  dependsOn:
  - ContainerBuild

  condition: succeeded()

  jobs:

  - job: Helm
    displayName: "Helm Lint and Template"

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Helm
    # --------------------------------------------------------

    - task: HelmInstaller@1
      displayName: "Install Helm"
      inputs:
        helmVersionToInstall: "latest"

    # --------------------------------------------------------
    # Download Terraform Outputs
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Outputs"
      inputs:
        artifact: "terraform-outputs"
        path: '$(Pipeline.Workspace)\terraform-outputs'

    - task: DownloadPipelineArtifact@2
      displayName: "Download Analyser Client ID"
      inputs:
        artifact: "analyser-client-id"
        path: '$(Pipeline.Workspace)\analyser-client-id'    

    # --------------------------------------------------------
    # Read infrastructure details
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Read infrastructure details"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          $outputFile = "$(Pipeline.Workspace)\terraform-outputs\terraform-outputs.json"

          if (-not (Test-Path $outputFile)) {
            throw "Terraform output artifact not found: $outputFile"
          }

          Write-Host "================================================"
          Write-Host "Reading Terraform Output Artifact"
          Write-Host "================================================"

          $json = Get-Content $outputFile -Raw

          Write-Host "Terraform output artifact size:"
          Write-Host "$($json.Length) characters"

          $outputs = $json | ConvertFrom-Json

          Write-Host ""
          Write-Host "Available Terraform outputs:"
          $outputs.PSObject.Properties.Name | ForEach-Object {
            Write-Host " - $_"
          }

          Write-Host ""
          Write-Host "================================================"
          Write-Host "OpenAI Outputs"
          Write-Host "================================================"

          if ($null -eq $outputs.openai_endpoint) {
            throw "openai_endpoint is missing from terraform-outputs.json."
          }

          if ($null -eq $outputs.openai_deployment_name) {
            throw "openai_deployment_name is missing from terraform-outputs.json."
          }

          $acrLoginServer = $outputs.acr_login_server.value
          $openAiEndpoint = $outputs.openai_endpoint.value
          $openAiDeployment = $outputs.openai_deployment_name.value

          Write-Host "ACR Login Server: [$acrLoginServer]"
          Write-Host "Azure OpenAI Endpoint: [$openAiEndpoint]"
          Write-Host "Azure OpenAI Deployment: [$openAiDeployment]"

          if ([string]::IsNullOrWhiteSpace($acrLoginServer)) {
            throw "acr_login_server is empty."
          }

          if ([string]::IsNullOrWhiteSpace($openAiEndpoint)) {
            throw "openai_endpoint is empty."
          }

          if ([string]::IsNullOrWhiteSpace($openAiDeployment)) {
            throw "openai_deployment_name is empty in terraform-outputs.json."
          }

          Write-Host "##vso[task.setvariable variable=acrLoginServer]$acrLoginServer"
          Write-Host "##vso[task.setvariable variable=openAiEndpoint]$openAiEndpoint"
          Write-Host "##vso[task.setvariable variable=openAiDeployment]$openAiDeployment"

    - task: PowerShell@2
      displayName: "Read analyser client ID"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          $clientIdFile = "$(Pipeline.Workspace)\analyser-client-id\analyser-client-id.txt"

          if (-not (Test-Path $clientIdFile)) {
            throw "Analyser client ID artifact not found: $clientIdFile"
          }

          $analyserClientId = (Get-Content $clientIdFile -Raw).Trim()

          if ([string]::IsNullOrWhiteSpace($analyserClientId)) {
            throw "Analyser client ID artifact is empty."
          }

          Write-Host "Analyser client ID loaded successfully."
          Write-Host "##vso[task.setvariable variable=analyserClientId]$analyserClientId"

    # --------------------------------------------------------
    # Helm Version
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Check Helm version"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          helm version

    # --------------------------------------------------------
    # Helm Lint
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Helm Lint"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          helm lint .\charts\sre-api `
            --set image.repository="$(acrLoginServer)/sre-api" `
            --set image.tag="$(Build.BuildId)" `
            --set collector.enabled=true `
            --set collectorImage.repository="$(acrLoginServer)/incident-collector" `
            --set collectorImage.tag="$(Build.BuildId)" `
            --set analyser.enabled=true `
            --set analyserImage.repository="$(acrLoginServer)/ai-analyser" `
            --set analyserImage.tag="$(Build.BuildId)" `
            --set-string azure.openaiEndpoint="$(openAiEndpoint)" `
            --set-string azure.openaiDeployment="$(openAiDeployment)" `
            --set metrics.enabled=true

    # --------------------------------------------------------
    # Helm Template Validation
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Helm Template Validation"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          helm template sre-api .\charts\sre-api `
            --namespace "$(namespace)" `
            --set image.repository="$(acrLoginServer)/sre-api" `
            --set image.tag="$(Build.BuildId)" `
            --set collector.enabled=true `
            --set collectorImage.repository="$(acrLoginServer)/incident-collector" `
            --set collectorImage.tag="$(Build.BuildId)" `
            --set analyser.enabled=true `
            --set analyserImage.repository="$(acrLoginServer)/ai-analyser" `
            --set analyserImage.tag="$(Build.BuildId)" `
            --set-string azure.openaiEndpoint="$(openAiEndpoint)" `
            --set-string azure.openaiDeployment="$(openAiDeployment)" `
            --set-string azure.analyserClientId="$(analyserClientId)" `
            --set metrics.enabled=true `
            --set-string collector.webhookToken="helm-validation-token" `
            --output-dir "$(Build.ArtifactStagingDirectory)\helm-rendered"

          Write-Host "Helm chart rendered successfully."

          Get-ChildItem `
            "$(Build.ArtifactStagingDirectory)\helm-rendered" `
            -Recurse

    # --------------------------------------------------------
    # Publish rendered Helm manifests
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: "Publish Helm Rendered Manifests"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\helm-rendered'
        artifact: "helm-rendered"
        publishLocation: "pipeline"


# ============================================================
# 6. HELM DEPLOY
# ============================================================

- stage: AKSDeploy
  displayName: "Deploy to AKS"

  dependsOn:
  - ContainerBuild
  - HelmValidation

  condition: succeeded()

  jobs:

  - job: Deploy
    displayName: "Deploy sre-api, collector and analyser"

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Download Terraform Outputs
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Outputs"
      inputs:
        artifact: "terraform-outputs"
        path: '$(Pipeline.Workspace)\terraform-outputs'


    - task: DownloadPipelineArtifact@2
      displayName: "Download Analyser Client ID"
      inputs:
        artifact: "analyser-client-id"
        path: '$(Pipeline.Workspace)\analyser-client-id' 

    # --------------------------------------------------------
    # Install Helm
    # --------------------------------------------------------

    - task: HelmInstaller@1
      displayName: "Install Helm"
      inputs:
        helmVersionToInstall: "latest"

    # --------------------------------------------------------
    # Configure AKS
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Configure AKS"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $outputFile = "$(Pipeline.Workspace)\terraform-outputs\terraform-outputs.json"

          $outputs = Get-Content $outputFile -Raw |
            ConvertFrom-Json

          $resourceGroup = $outputs.resource_group_name.value
          $aksName = $outputs.aks_name.value

          Write-Host "Resource Group: $resourceGroup"
          Write-Host "AKS Cluster: $aksName"

          az aks get-credentials `
            --resource-group $resourceGroup `
            --name $aksName `
            --overwrite-existing

          kubectl get nodes

    # --------------------------------------------------------
    # Read infrastructure details
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Read infrastructure details"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          $outputFile = "$(Pipeline.Workspace)\terraform-outputs\terraform-outputs.json"

          $outputs = Get-Content $outputFile -Raw |
            ConvertFrom-Json

          $acrLoginServer = $outputs.acr_login_server.value
          $openAiEndpoint = $outputs.openai_endpoint.value
          $openAiDeployment = $outputs.openai_deployment_name.value

          Write-Host "ACR Login Server: $acrLoginServer"
          Write-Host "Azure OpenAI Endpoint: $openAiEndpoint"
          Write-Host "Azure OpenAI Deployment: $openAiDeployment"

          if ([string]::IsNullOrWhiteSpace($openAiEndpoint)) {
            throw "openai_endpoint Terraform output is empty."
          }

          if ([string]::IsNullOrWhiteSpace($openAiDeployment)) {
            throw "openai_deployment Terraform output is empty."
          }

          Write-Host "##vso[task.setvariable variable=acrLoginServer]$acrLoginServer"
          Write-Host "##vso[task.setvariable variable=openAiEndpoint]$openAiEndpoint"
          Write-Host "##vso[task.setvariable variable=openAiDeployment]$openAiDeployment"

    - task: PowerShell@2
      displayName: "Read analyser client ID"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          $clientIdFile = "$(Pipeline.Workspace)\analyser-client-id\analyser-client-id.txt"

          if (-not (Test-Path $clientIdFile)) {
            throw "Analyser client ID artifact not found: $clientIdFile"
          }

          $analyserClientId = (Get-Content $clientIdFile -Raw).Trim()

          if ([string]::IsNullOrWhiteSpace($analyserClientId)) {
            throw "Analyser client ID artifact is empty."
          }

          Write-Host "Analyser client ID loaded successfully."
          Write-Host "##vso[task.setvariable variable=analyserClientId]$analyserClientId"

    # --------------------------------------------------------
    # Helm Deploy
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Helm Deploy"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================================"
          Write-Host "Deployment Images"
          Write-Host "================================================"

          Write-Host "$(acrLoginServer)/sre-api:$(Build.BuildId)"
          Write-Host "$(acrLoginServer)/incident-collector:$(Build.BuildId)"
          Write-Host "$(acrLoginServer)/ai-analyser:$(Build.BuildId)"

          Write-Host "================================================"
          Write-Host "Azure OpenAI Configuration"
          Write-Host "================================================"

          Write-Host "Endpoint: $(openAiEndpoint)"
          Write-Host "Deployment: $(openAiDeployment)"

          helm upgrade --install sre-api .\charts\sre-api `
            --namespace "$(namespace)" `
            --create-namespace `
            --set image.repository="$(acrLoginServer)/sre-api" `
            --set image.tag="$(Build.BuildId)" `
            --set collector.enabled=true `
            --set collectorImage.repository="$(acrLoginServer)/incident-collector" `
            --set collectorImage.tag="$(Build.BuildId)" `
            --set analyser.enabled=true `
            --set analyserImage.repository="$(acrLoginServer)/ai-analyser" `
            --set analyserImage.tag="$(Build.BuildId)" `
            --set-string azure.openaiEndpoint="$(openAiEndpoint)" `
            --set-string azure.openaiDeployment="$(openAiDeployment)" `
            --set-string azure.analyserClientId="$(analyserClientId)" `
            --set metrics.enabled=true `
            --set-string collector.webhookToken="$env:COLLECTOR_WEBHOOK_TOKEN" `
            --force-conflicts `
            --wait `
            --timeout 10m

           if ($LASTEXITCODE -ne 0) {
             throw "Helm deployment failed with exit code $LASTEXITCODE."
           }

           Write-Host "Helm deployment completed successfully."  

      env:
        COLLECTOR_WEBHOOK_TOKEN: $(collectorWebhookToken)

    # --------------------------------------------------------
    # Deployment Status
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Validate deployment rollout"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================================"
          Write-Host "sre-api Rollout"
          Write-Host "================================================"

          kubectl rollout status `
            deployment/sre-api `
            -n "$(namespace)" `
            --timeout=300s

          Write-Host "================================================"
          Write-Host "Incident Collector Rollout"
          Write-Host "================================================"

          kubectl rollout status `
            deployment/incident-collector `
            -n "$(namespace)" `
            --timeout=300s

          Write-Host "================================================"
          Write-Host "AI Analyser Rollout"
          Write-Host "================================================"

          kubectl rollout status `
            deployment/ai-analyser `
            -n "$(namespace)" `
            --timeout=300s

          Write-Host "================================================"
          Write-Host "Pods"
          Write-Host "================================================"

          kubectl get pods `
            -n "$(namespace)" `
            -o wide

          Write-Host "================================================"
          Write-Host "Deployments"
          Write-Host "================================================"

          kubectl get deployments `
            -n "$(namespace)"


# ============================================================
# 7. SMOKE TEST
# ============================================================

- stage: SmokeTest
  displayName: "AKS Smoke Test"

  dependsOn:
  - AKSDeploy

  condition: succeeded()

  jobs:

  - job: Smoke
    displayName: "Validate sre-api and AI analyser"

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Download Terraform Outputs
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Outputs"
      inputs:
        artifact: "terraform-outputs"
        path: '$(Pipeline.Workspace)\terraform-outputs'

    # --------------------------------------------------------
    # Configure AKS
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Configure AKS"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $outputFile = "$(Pipeline.Workspace)\terraform-outputs\terraform-outputs.json"

          $outputs = Get-Content $outputFile -Raw |
            ConvertFrom-Json

          $resourceGroup = $outputs.resource_group_name.value
          $aksName = $outputs.aks_name.value

          az aks get-credentials `
            --resource-group $resourceGroup `
            --name $aksName `
            --overwrite-existing

    # --------------------------------------------------------
    # Kubernetes Validation
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Validate Kubernetes deployment"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================================"
          Write-Host "Kubernetes Nodes"
          Write-Host "================================================"

          kubectl get nodes -o wide

          Write-Host "================================================"
          Write-Host "Pods"
          Write-Host "================================================"

          kubectl get pods `
            -n "$(namespace)" `
            -o wide

          Write-Host "================================================"
          Write-Host "Deployments"
          Write-Host "================================================"

          kubectl get deployment `
            -n "$(namespace)"

          Write-Host "================================================"
          Write-Host "sre-api HPA"
          Write-Host "================================================"

          kubectl get hpa sre-api `
            -n "$(namespace)"

          Write-Host "================================================"
          Write-Host "sre-api PDB"
          Write-Host "================================================"

          kubectl get pdb sre-api `
            -n "$(namespace)"

          Write-Host "================================================"
          Write-Host "Rollout Status"
          Write-Host "================================================"

          kubectl rollout status `
            deployment/sre-api `
            -n "$(namespace)" `
            --timeout=300s

          kubectl rollout status `
            deployment/incident-collector `
            -n "$(namespace)" `
            --timeout=300s

          kubectl rollout status `
            deployment/ai-analyser `
            -n "$(namespace)" `
            --timeout=300s

    # --------------------------------------------------------
    # Service Validation
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Validate Kubernetes services"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================================"
          Write-Host "sre-api service"
          Write-Host "================================================"

          kubectl get service sre-api `
            -n "$(namespace)"

          kubectl get endpoints sre-api `
            -n "$(namespace)"

          Write-Host "================================================"
          Write-Host "Incident collector service"
          Write-Host "================================================"

          kubectl get service incident-collector `
            -n "$(namespace)"

          kubectl get endpoints incident-collector `
            -n "$(namespace)"

          Write-Host "================================================"
          Write-Host "AI analyser service"
          Write-Host "================================================"

          kubectl get service ai-analyser `
            -n "$(namespace)"

          kubectl get endpoints ai-analyser `
            -n "$(namespace)"

    # --------------------------------------------------------
    # sre-api Application Smoke Test
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "sre-api smoke test"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting temporary sre-api port-forward..."

          $process = Start-Process `
            -FilePath "kubectl" `
            -ArgumentList @(
              "port-forward",
              "service/sre-api",
              "8000:8000",
              "-n",
              "$(namespace)"
            ) `
            -PassThru `
            -WindowStyle Hidden

          try {

            Start-Sleep -Seconds 10

            Write-Host "Testing /healthz"

            $health = Invoke-RestMethod `
              -Uri "http://127.0.0.1:8000/healthz" `
              -Method Get

            Write-Host "Health response:"
            $health | ConvertTo-Json

            if ($health.status -ne "healthy") {
              throw "Health check failed."
            }

            Write-Host "Testing /readyz"

            $ready = Invoke-RestMethod `
              -Uri "http://127.0.0.1:8000/readyz" `
              -Method Get

            Write-Host "Readiness response:"
            $ready | ConvertTo-Json

            if ($ready.status -ne "ready") {
              throw "Readiness check failed."
            }

            Write-Host "Testing /metrics"

            $metrics = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8000/metrics" `
              -Method Get `
              -UseBasicParsing

            Write-Host "Metrics HTTP status: $($metrics.StatusCode)"

            if ($metrics.StatusCode -ne 200) {
              throw "Metrics endpoint returned HTTP $($metrics.StatusCode)"
            }

            if ($metrics.Content -notmatch "http_requests_total") {
              throw "Expected Prometheus metric 'http_requests_total' not found."
            }

            Write-Host "Prometheus metrics endpoint is healthy."
            Write-Host "sre-api smoke tests passed."

          }
          finally {

            if ($process -and -not $process.HasExited) {
              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }

          }

    # --------------------------------------------------------
    # AI analyser Health Smoke Test
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "AI analyser smoke test"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          $localPort = 18081
          $servicePort = 8080

          $stdoutFile = "$(Agent.TempDirectory)\ai-analyser-portforward.stdout.log"
          $stderrFile = "$(Agent.TempDirectory)\ai-analyser-portforward.stderr.log"

          Remove-Item $stdoutFile, $stderrFile `
           -Force `
           -ErrorAction SilentlyContinue

          Write-Host "================================================"
          Write-Host "AI Analyser Smoke Test"
          Write-Host "================================================"

          Write-Host "Checking service..."
          kubectl get service ai-analyser -n "$(namespace)"

          Write-Host ""
          Write-Host "Checking endpoints..."
          kubectl get endpoints ai-analyser -n "$(namespace)"

          Write-Host ""
          Write-Host "Checking pods..."
          kubectl get pods `
           -n "$(namespace)" `
           -l app=ai-analyser `
           -o wide

          Write-Host ""
          Write-Host "Starting port-forward:"
          Write-Host "127.0.0.1:$localPort -> service/ai-analyser:$servicePort"

          $process = Start-Process `
           -FilePath "kubectl" `
           -ArgumentList @(
            "port-forward",
            "service/ai-analyser",
            "${localPort}:${servicePort}",
            "-n",
            "$(namespace)",
            "--address",
            "127.0.0.1"
          ) `
           -PassThru `
           -WindowStyle Hidden `
           -RedirectStandardOutput $stdoutFile `
           -RedirectStandardError $stderrFile

          try {

          $portReady = $false

          for ($i = 1; $i -le 30; $i++) {

          Start-Sleep -Seconds 1

          if ($process.HasExited) {

            Write-Host ""
            Write-Host "kubectl port-forward exited."
            Write-Host "Exit code: $($process.ExitCode)"

            if (Test-Path $stdoutFile) {
              Write-Host ""
              Write-Host "========== PORT-FORWARD STDOUT =========="
              Get-Content $stdoutFile
            }

            if (Test-Path $stderrFile) {
              Write-Host ""
              Write-Host "========== PORT-FORWARD STDERR =========="
              Get-Content $stderrFile
            }

            throw "AI analyser port-forward process terminated unexpectedly."
          }

          $connection = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port $localPort `
            -WarningAction SilentlyContinue

          if ($connection.TcpTestSucceeded) {
            $portReady = $true
            Write-Host "Port-forward is ready."
            break
          }

          Write-Host "Waiting for port-forward... attempt $i/30"
          }

          if (-not $portReady) {

          Write-Host ""
          Write-Host "========== PORT-FORWARD STDOUT =========="

          if (Test-Path $stdoutFile) {
            Get-Content $stdoutFile
          }

          Write-Host ""
          Write-Host "========== PORT-FORWARD STDERR =========="

          if (Test-Path $stderrFile) {
            Get-Content $stderrFile
          }

          throw "AI analyser port-forward did not become ready within 30 seconds."
          }

          Write-Host ""
          Write-Host "Testing AI analyser /healthz..."

          $health = Invoke-RestMethod `
           -Uri "http://127.0.0.1:$localPort/healthz" `
           -Method Get

            Write-Host ""
            Write-Host "Health response:"
            $health | ConvertTo-Json

          if ($health.status -ne "healthy") {
          throw "AI analyser health check failed."
          }

          Write-Host ""
          Write-Host "AI analyser smoke test passed."

          }
          finally {

          if ($process -and -not $process.HasExited) {
           Stop-Process `
            -Id $process.Id `
            -Force `
            -ErrorAction SilentlyContinue
          }

          if (Test-Path $stdoutFile) {
          Remove-Item $stdoutFile -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path $stderrFile) {
          Remove-Item $stderrFile -Force -ErrorAction SilentlyContinue
          }

          }