trigger: none

variables:
  terraformVersion: "1.11.2"
  azureServiceConnection: "sc-azure-ai-aks-sre"
  imageName: "sre-api"
  namespace: "sre"

stages:

# ============================================================
# 1. TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: "Terraform Plan"

  jobs:
  - job: Plan
    displayName: "Terraform Plan"

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self
      displayName: "Checkout source"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "$(terraformVersion)"

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform init -input=false

    # --------------------------------------------------------
    # Terraform Format
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Terraform Format Check"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        script: |
          $ErrorActionPreference = "Stop"

          terraform fmt -check -recursive

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Terraform Validate"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        script: |
          $ErrorActionPreference = "Stop"

          terraform validate

    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform plan `
            -input=false `
            -out="$(Build.ArtifactStagingDirectory)\tfplan"

    # --------------------------------------------------------
    # Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Plan"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\tfplan'
        artifact: "terraform-plan"
        publishLocation: "pipeline"


# ============================================================
# 2. TERRAFORM APPLY
# ============================================================

- stage: TerraformApply
  displayName: "Terraform Apply"

  dependsOn:
  - TerraformPlan

  condition: succeeded()

  jobs:

  # ----------------------------------------------------------
  # Manual approval
  # ----------------------------------------------------------

  - job: Approval
    displayName: "Infrastructure Approval"

    pool: server

    steps:
    - task: ManualValidation@1
      displayName: "Approve Terraform Apply"
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: |
          YOUR_EMAIL
        instructions: |
          Review the Terraform plan.
          Approve to apply the reviewed infrastructure changes.
        onTimeout: "reject"

  # ----------------------------------------------------------
  # Terraform Apply
  # ----------------------------------------------------------

  - job: Apply
    displayName: "Terraform Apply"

    dependsOn:
    - Approval

    condition: succeeded()

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self
      displayName: "Checkout source"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "$(terraformVersion)"

    # --------------------------------------------------------
    # Download Terraform Plan
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Plan"
      inputs:
        artifact: "terraform-plan"
        path: '$(Pipeline.Workspace)\terraform-plan'

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform init -input=false

    # --------------------------------------------------------
    # Terraform Apply
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Terraform Apply"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          terraform apply `
            -input=false `
            "$(Pipeline.Workspace)\terraform-plan\tfplan"

    # --------------------------------------------------------
    # Export Terraform Outputs
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Export Terraform Outputs"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        workingDirectory: '$(Build.SourcesDirectory)\infra'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $subscriptionId = az account show `
            --query "id" `
            -o tsv

          $env:TF_VAR_subscription_id = $subscriptionId

          $env:ARM_USE_OIDC = "true"
          $env:ARM_USE_AZUREAD = "true"

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_OIDC_AZURE_SERVICE_CONNECTION_ID = $env:AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

          Write-Host "Exporting Terraform outputs..."

          $outputFile = "$(Build.ArtifactStagingDirectory)\terraform-outputs.json"

          $terraformOutput = terraform output -json

          if ($LASTEXITCODE -ne 0) {
            throw "terraform output failed with exit code $LASTEXITCODE"
          }

          [System.IO.File]::WriteAllText(
            $outputFile,
            $terraformOutput,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Terraform outputs exported to:"
          Write-Host $outputFile

    # --------------------------------------------------------
    # Publish Terraform Outputs
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Outputs"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\terraform-outputs.json'
        artifact: "terraform-outputs"
        publishLocation: "pipeline"


# ============================================================
# 3. APPLICATION TESTS
# ============================================================

- stage: ApplicationTests
  displayName: "Application Tests"

  dependsOn:
  - TerraformApply

  condition: succeeded()

  jobs:

  - job: Test
    displayName: "Run Application Tests"

    pool:
      vmImage: "ubuntu-latest"

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      displayName: "Use Python 3.12"
      inputs:
        versionSpec: "3.12"

    - bash: |
        set -euo pipefail

        cd "$(Build.SourcesDirectory)/app"

        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

        python -m pytest -v

      displayName: "Run pytest"


# ============================================================
# 4. DOCKER BUILD + TRIVY + ACR PUSH
# ============================================================

- stage: ContainerBuild
  displayName: "Build Scan Push"

  dependsOn:
  - TerraformApply
  - ApplicationTests

  condition: succeeded()

  jobs:

  - job: Build
    displayName: "Build sre-api"

    pool:
      vmImage: "ubuntu-latest"

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Download Terraform Outputs
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Outputs"
      inputs:
        artifact: "terraform-outputs"
        path: "$(Pipeline.Workspace)/terraform-outputs"

    # --------------------------------------------------------
    # Read ACR details
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        OUTPUT_FILE="$(Pipeline.Workspace)/terraform-outputs/terraform-outputs.json"

        ACR_NAME=$(python -c "
        import json
        with open('$OUTPUT_FILE', encoding='utf-8-sig') as f:
            data = json.load(f)
        print(data['acr_name']['value'])
        ")

        ACR_LOGIN_SERVER=$(python -c "
        import json
        with open('$OUTPUT_FILE', encoding='utf-8-sig') as f:
            data = json.load(f)
        print(data['acr_login_server']['value'])
        ")

        echo "ACR: $ACR_NAME"
        echo "Login server: $ACR_LOGIN_SERVER"

        echo "##vso[task.setvariable variable=acrName]$ACR_NAME"
        echo "##vso[task.setvariable variable=acrLoginServer]$ACR_LOGIN_SERVER"

      displayName: "Read ACR details"

    # --------------------------------------------------------
    # Docker Build
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        cd "$(Build.SourcesDirectory)/app"

        docker build \
          -t "$(acrLoginServer)/sre-api:$(Build.BuildId)" \
          -t "$(acrLoginServer)/sre-api:latest" \
          .

      displayName: "Build Docker image"

    # incident collector

    - bash: |
        set -euo pipefail

        cd "$(Build.SourcesDirectory)/incident-collector"

        docker build \
           -t "$(acrLoginServer)/incident-collector:$(Build.BuildId)" \
           -t "$(acrLoginServer)/incident-collector:latest" \
           .

      displayName: "Build incident collector image" 

    # --------------------------------------------------------
    # Trivy Security Scan
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install -y wget gnupg

        wget -qO- \
          https://aquasecurity.github.io/trivy-repo/deb/public.key |
          gpg --dearmor |
          sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo \
          "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
          https://aquasecurity.github.io/trivy-repo/deb \
          generic main" |
          sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy

        trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          "$(acrLoginServer)/sre-api:$(Build.BuildId)"

      displayName: "Security scan"

    # incident collector

    - bash: |
        set -euo pipefail

        trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          "$(acrLoginServer)/incident-collector:$(Build.BuildId)"

      displayName: "Scan incident collector image"  

    # --------------------------------------------------------
    # Login to ACR
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Login to ACR"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "bash"
        scriptLocation: "inlineScript"
        inlineScript: |
          set -euo pipefail

          az acr login --name "$(acrName)"

    # --------------------------------------------------------
    # Push Image
    # --------------------------------------------------------

    - bash: |
        set -euo pipefail

        docker push \
          "$(acrLoginServer)/sre-api:$(Build.BuildId)"

        docker push \
          "$(acrLoginServer)/sre-api:latest"

      displayName: "Push image to ACR"

    # incident collector

    - bash: |
        set -euo pipefail

        docker push \
          "$(acrLoginServer)/incident-collector:$(Build.BuildId)"

        docker push \
          "$(acrLoginServer)/incident-collector:latest"

      displayName: "Push incident collector image"


# ============================================================
# 5. HELM VALIDATION
# ============================================================

- stage: HelmValidation
  displayName: "Validate Helm Chart"

  dependsOn:
  - ContainerBuild

  condition: succeeded()

  jobs:

  - job: Helm
    displayName: "Helm Lint and Template"

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Install Helm
    # --------------------------------------------------------

    - task: HelmInstaller@1
      displayName: "Install Helm"
      inputs:
        helmVersionToInstall: "latest"

    # --------------------------------------------------------
    # Download Terraform Outputs
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Outputs"
      inputs:
        artifact: "terraform-outputs"
        path: '$(Pipeline.Workspace)\terraform-outputs'

    # --------------------------------------------------------
    # Read ACR information
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Read ACR details"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          $outputFile = "$(Pipeline.Workspace)\terraform-outputs\terraform-outputs.json"

          $outputs = Get-Content $outputFile -Raw |
            ConvertFrom-Json

          $acrLoginServer = $outputs.acr_login_server.value

          Write-Host "ACR Login Server: $acrLoginServer"

          Write-Host "##vso[task.setvariable variable=acrLoginServer]$acrLoginServer"

    # --------------------------------------------------------
    # Helm Version
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Check Helm version"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          helm version

    # --------------------------------------------------------
    # Helm Lint
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Helm Lint"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          helm lint .\charts\sre-api `
            --set image.repository="$(acrLoginServer)/sre-api" `
            --set image.tag="$(Build.BuildId)" `
            --set collector.enabled=true `
            --set analyser.enabled=false `
            --set metrics.enabled=true

    # --------------------------------------------------------
    # Helm Template Validation
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Helm Template Validation"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          $renderedFile = "$(Build.ArtifactStagingDirectory)\rendered-manifest.yaml"

          helm template sre-api .\charts\sre-api `
            --namespace "$(namespace)" `
            --set image.repository="$(acrLoginServer)/sre-api" `
            --set image.tag="$(Build.BuildId)" `
            --set collector.enabled=true `
            --set analyser.enabled=false `
            --set metrics.enabled=true `
            --set-string collector.webhookToken="helm-validation-token" `
            --output-dir "$(Build.ArtifactStagingDirectory)\helm-rendered"

          Write-Host "Helm chart rendered successfully."

          Get-ChildItem `
            "$(Build.ArtifactStagingDirectory)\helm-rendered" `
            -Recurse

    # --------------------------------------------------------
    # Publish rendered Helm manifests
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: "Publish Helm Rendered Manifests"
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\helm-rendered'
        artifact: "helm-rendered"
        publishLocation: "pipeline"


# ============================================================
# 6. HELM DEPLOY
# ============================================================

- stage: AKSDeploy
  displayName: "Deploy to AKS"

  dependsOn:
  - ContainerBuild
  - HelmValidation

  condition: succeeded()

  jobs:

  - job: Deploy
    displayName: "Deploy sre-api"

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Download Terraform Outputs
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Outputs"
      inputs:
        artifact: "terraform-outputs"
        path: '$(Pipeline.Workspace)\terraform-outputs'

    # --------------------------------------------------------
    # Install Helm
    # --------------------------------------------------------

    - task: HelmInstaller@1
      displayName: "Install Helm"
      inputs:
        helmVersionToInstall: "latest"

    # --------------------------------------------------------
    # Configure AKS
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Configure AKS"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $outputFile = "$(Pipeline.Workspace)\terraform-outputs\terraform-outputs.json"

          $outputs = Get-Content $outputFile -Raw |
            ConvertFrom-Json

          $resourceGroup = $outputs.resource_group_name.value
          $aksName = $outputs.aks_name.value

          Write-Host "Resource Group: $resourceGroup"
          Write-Host "AKS Cluster: $aksName"

          az aks get-credentials `
            --resource-group $resourceGroup `
            --name $aksName `
            --overwrite-existing

          kubectl get nodes

    # --------------------------------------------------------
    # Read ACR details
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Read ACR details"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          $outputFile = "$(Pipeline.Workspace)\terraform-outputs\terraform-outputs.json"

          $outputs = Get-Content $outputFile -Raw |
            ConvertFrom-Json

          $acrLoginServer = $outputs.acr_login_server.value

          Write-Host "ACR Login Server: $acrLoginServer"

          Write-Host "##vso[task.setvariable variable=acrLoginServer]$acrLoginServer"

    # --------------------------------------------------------
    # Helm Deploy
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Helm Deploy"
      inputs:
        targetType: "inline"
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "Deploying image:"
          Write-Host "$(acrLoginServer)/sre-api:$(Build.BuildId)"

          helm upgrade --install sre-api .\charts\sre-api `
            --namespace "$(namespace)" `
            --create-namespace `
            --set image.repository="$(acrLoginServer)/sre-api" `
            --set image.tag="$(Build.BuildId)" `
            --set collector.enabled=true `
            --set analyser.enabled=false `
            --set metrics.enabled=true `
            --set-string collector.webhookToken="$env:COLLECTOR_WEBHOOK_TOKEN" `
            --wait `
            --timeout 10m

          Write-Host "Helm deployment completed successfully."
      env:
        COLLECTOR_WEBHOOK_TOKEN: $(collectorWebhookToken)

    # --------------------------------------------------------
    # Deployment Status
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Validate deployment rollout"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          kubectl rollout status `
            deployment/sre-api `
            -n "$(namespace)" `
            --timeout=300s

          kubectl get pods -n "$(namespace)"

          kubectl get deployment sre-api `
            -n "$(namespace)"


# 7. SMOKE TEST
# ============================================================

- stage: SmokeTest
  displayName: "AKS Smoke Test"

  dependsOn:
  - AKSDeploy

  condition: succeeded()

  jobs:

  - job: Smoke
    displayName: "Validate sre-api"

    pool:
      name: "MultiOSPool"

    steps:

    - checkout: self

    # --------------------------------------------------------
    # Download Terraform Outputs
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Outputs"
      inputs:
        artifact: "terraform-outputs"
        path: '$(Pipeline.Workspace)\terraform-outputs'

    # --------------------------------------------------------
    # Configure AKS
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: "Configure AKS"
      inputs:
        azureSubscription: "$(azureServiceConnection)"
        addSpnToEnvironment: true
        scriptType: "ps"
        scriptLocation: "inlineScript"
        inlineScript: |
          $ErrorActionPreference = "Stop"

          $outputFile = "$(Pipeline.Workspace)\terraform-outputs\terraform-outputs.json"

          $outputs = Get-Content $outputFile -Raw |
            ConvertFrom-Json

          $resourceGroup = $outputs.resource_group_name.value
          $aksName = $outputs.aks_name.value

          az aks get-credentials `
            --resource-group $resourceGroup `
            --name $aksName `
            --overwrite-existing

    # --------------------------------------------------------
    # Kubernetes Validation
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Validate Kubernetes deployment"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================================"
          Write-Host "Kubernetes Nodes"
          Write-Host "================================================"

          kubectl get nodes -o wide

          Write-Host "================================================"
          Write-Host "Pods"
          Write-Host "================================================"

          kubectl get pods `
            -n "$(namespace)" `
            -o wide

          Write-Host "================================================"
          Write-Host "Deployment"
          Write-Host "================================================"

          kubectl get deployment sre-api `
            -n "$(namespace)"

          Write-Host "================================================"
          Write-Host "HPA"
          Write-Host "================================================"

          kubectl get hpa sre-api `
            -n "$(namespace)"

          Write-Host "================================================"
          Write-Host "PDB"
          Write-Host "================================================"

          kubectl get pdb sre-api `
            -n "$(namespace)"

          Write-Host "================================================"
          Write-Host "Rollout Status"
          Write-Host "================================================"

          kubectl rollout status `
            deployment/sre-api `
            -n "$(namespace)" `
            --timeout=300s

    # --------------------------------------------------------
    # Service Validation
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Validate Kubernetes service"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          kubectl get service sre-api `
            -n "$(namespace)"

          kubectl get endpoints sre-api `
            -n "$(namespace)"

    # --------------------------------------------------------
    # Application Smoke Test
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: "Application smoke test"
      inputs:
        targetType: "inline"
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting temporary port-forward..."

          $process = Start-Process `
            -FilePath "kubectl" `
            -ArgumentList @(
              "port-forward",
              "service/sre-api",
              "8000:8000",
              "-n",
              "$(namespace)"
            ) `
            -PassThru `
            -WindowStyle Hidden

          try {

            Start-Sleep -Seconds 10

            Write-Host "Testing /healthz"

            $health = Invoke-RestMethod `
              -Uri "http://127.0.0.1:8000/healthz" `
              -Method Get

            Write-Host "Health response:"
            $health | ConvertTo-Json

            if ($health.status -ne "healthy") {
              throw "Health check failed."
            }

            Write-Host "Testing /readyz"

            $ready = Invoke-RestMethod `
              -Uri "http://127.0.0.1:8000/readyz" `
              -Method Get

            Write-Host "Readiness response:"
            $ready | ConvertTo-Json

            if ($ready.status -ne "ready") {
              throw "Readiness check failed."
            }

            Write-Host "Testing /metrics"

            $metrics = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8000/metrics" `
              -Method Get `
              -UseBasicParsing

            Write-Host "Metrics HTTP status: $($metrics.StatusCode)"

            if ($metrics.StatusCode -ne 200) {
              throw "Metrics endpoint returned HTTP $($metrics.StatusCode)"
            }

            if ($metrics.Content -notmatch "http_requests_total") {
              throw "Expected Prometheus metric 'http_requests_total' not found."
            }

            Write-Host "Prometheus metrics endpoint is healthy."

            Write-Host "Application smoke tests passed."

          }
          finally {

            if ($process -and -not $process.HasExited) {
              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }

          }