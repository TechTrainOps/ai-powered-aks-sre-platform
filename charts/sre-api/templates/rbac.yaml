{{- if .Values.collector.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-collector
  namespace: {{ .Values.namespace }}
rules:
  # Permissions required for incident evidence collection
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch

  # Permissions required for the remediation runbook
  # to restart the sre-api Deployment
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
 
  # Permissions required for the rollback runbook
  # to identify the previous sre-api ReplicaSet revision
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-collector
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: incident-collector
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-collector
{{- end }}