image:
  repository: example.azurecr.io/sre-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

collector:
  enabled: false

collectorImage:
  repository: example.azurecr.io/incident-collector
  tag: "1.0.0"
  pullPolicy: IfNotPresent

analyser:
  enabled: false

analyserImage:
  repository: example.azurecr.io/ai-analyser
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2
namespace: sre

service:
  port: 8000
  type: LoadBalancer

collectorService:
  port: 8080
  type: ClusterIP

analyserService:
  port: 8080
  type: ClusterIP

azure:
  openaiEndpoint: ""
  openaiDeployment: ""
  logWorkspaceId: ""
  analyserClientId: ""
  collectorClientId: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  minReplicas: 2
  maxReplicas: 8
  cpuUtilization: 70

pdb:
  minAvailable: 1
